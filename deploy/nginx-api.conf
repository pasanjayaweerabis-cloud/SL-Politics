# SL Politics — reference nginx configuration for the API origin (H-1).
#
# docs/security-audit-followup-2026-09-04.md's H-1: this repository documented
# "run the API behind a reverse proxy" but shipped no proxy config for it at
# all, and the API's own JAVORA_TRUST_PROXY flag trusted X-Forwarded-For from
# ANY peer once set — so the documented production configuration was a total
# rate-limit bypass. This file is that missing proxy. Deploy it (or an
# equivalent that upholds the same three rules below) before setting
# JAVORA_TRUSTED_PROXIES to anything.
#
# THE THREE RULES THIS FILE EXISTS TO ENFORCE:
#
#   1. X-Forwarded-For is OVERWRITTEN here, never appended to. `proxy_set_
#      header` replaces the header nginx sends upstream — it does not carry
#      forward whatever a client sent, so the API always sees exactly one
#      value: this proxy's own view of who connected to it. An "add_header"-
#      style proxy that APPENDS to a client-supplied X-Forwarded-For would let
#      a client prepend forged entries ahead of the real one.
#   2. This proxy's own address is what server/api/server.ts's
#      JAVORA_TRUSTED_PROXIES allowlist must name — that is the socket peer
#      the API actually sees once this file is in front of it.
#   3. Edge-level rate and connection limits exist here TOO, independent of
#      the API's own in-process limiter (server/api/server.ts's rateBuckets) —
#      defense in depth against exactly the flood the process-local limiter
#      cannot fully absorb on its own (SECURITY--SL Politics.md §17).
#
# Zone definitions are http-context directives — valid here only because this
# file is `include`d from inside an http {} block, same as deploy/nginx.conf.
# A tighter budget than the static site's own (deploy/nginx.conf) is
# deliberate: this origin answers JSON to a script or an app, not to a search
# crawler walking every prerendered page, so there is no crawlability
# invariant to protect here the way there is for the static site.
limit_req_zone $binary_remote_addr zone=javora_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=javora_api_conn:10m;

server {
  listen 443 ssl;
  http2 on;
  server_name api.javora.lk;

  # TLS. Paths assume certbot's default Let's Encrypt layout — replace with
  # wherever your certificate actually lives; nginx refuses to start with a
  # missing certificate, so these are not a working default as shipped.
  ssl_certificate     /etc/letsencrypt/live/api.javora.lk/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.javora.lk/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:JavoraApiSSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # OCSP stapling — see deploy/nginx.conf's matching config for what each
  # directive does. ssl_trusted_certificate is the CA chain, not this site's
  # own certificate.
  ssl_stapling on;
  ssl_stapling_verify on;
  ssl_trusted_certificate /etc/letsencrypt/live/api.javora.lk/chain.pem;
  resolver 1.1.1.1 8.8.8.8 valid=300s;
  resolver_timeout 5s;

  server_tokens off;

  # The API validates and rejects oversized input itself (server/api/
  # validation.ts and, for the one write endpoint, server/api/corrections.ts's
  # own 8 KB cap enforced while reading), but nothing legitimate sends this
  # origin a large body at all: every endpoint is GET/OPTIONS except
  # POST /api/corrections, and a correction report has no reason to be large.
  # Reject at the edge first. Keep this number and MAX_BODY_BYTES in step.
  client_max_body_size 8k;

  limit_req  zone=javora_api burst=20 nodelay;
  limit_conn zone=javora_api_conn 20;

  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;

    # Rule 1 above: overwrite, never append.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header Host            $host;
    proxy_set_header X-Forwarded-Proto https;

    # The API sets its own response headers (CORS, cache-control, nosniff,
    # referrer-policy — server/api/server.ts's sendJson); this proxy adds
    # nothing and does not rewrite them.

    proxy_connect_timeout 5s;
    proxy_send_timeout    10s;
    proxy_read_timeout    10s;
  }

  location ~ /\. {
    deny all;
  }
}

server {
  listen 80;
  server_name api.javora.lk;
  return 301 https://api.javora.lk$request_uri;
}
