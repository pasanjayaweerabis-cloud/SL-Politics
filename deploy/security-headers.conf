# SL Politics — shared security response headers (H-2).
#
# nginx inherits `add_header` from an enclosing level ONLY when the current
# level declares none of its own. deploy/nginx.conf has three `location`
# blocks that each declare a `Cache-Control` header of their own
# (/assets/, ~* \.html$, the sitemap/robots block) — before this file
# existed, every response those blocks matched (all of the site's JS/CSS,
# every *.html URL, robots.txt and sitemap.xml) silently carried NONE of the
# headers below: no CSP, no HSTS, no framing protection, no nosniff.
#
# `include` this file from the `server` block AND from every `location`
# block that declares its own `add_header` — deploy/nginxCsp.test.mjs parses
# deploy/nginx.conf and fails the build if a `location` block ever declares
# `add_header` without also including this file, so a future caching rule
# cannot reintroduce this gap silently.
#
# Placement: deploy this file in the same directory nginx resolves this
# relative `include` against — nginx resolves a relative include path
# against the directory of the MAIN configuration file, not the file doing
# the including. In this repository deploy/nginx.conf and this file already
# sit together; if you copy deploy/nginx.conf elsewhere, copy this file to
# the same place (or adjust the include paths in nginx.conf to be absolute).
#
# Keep the CSP line byte-identical to dist/csp.txt — it contains a sha256
# hash of the inline theme script in index.html, and a stale hash silently
# reintroduces the flash-of-wrong-theme that script exists to prevent.
#
#   Regenerate with:  npm run build && cat dist/csp.txt

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-qhFPvR6k5WXKAdGzOxt1wM2JDYGs4ey0R6qT9bEaHBk='; style-src 'self'; font-src 'self'; img-src 'self' data: https://www.parliament.lk; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header X-Frame-Options           "DENY" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
