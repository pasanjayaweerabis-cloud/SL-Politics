# SL Politics — reference nginx configuration for the prerendered static site.
#
# The executable specification for this file is scripts/serve-dist.mjs. If the
# two disagree, that script is right: it is the one exercised during
# verification.
#
# THE ONE THING THAT MUST NOT BE CHANGED CASUALLY is the try_files line. The
# usual single-page-app recipe is:
#
#     try_files $uri /index.html;
#
# which answers every unmatched path with the app shell and HTTP 200. Under
# that rule /person/anything-at-all returns 200 with the homepage, search
# engines index an unlimited supply of pages that do not exist, and — worse —
# every prerendered profile is shadowed by the shell, so the crawlable HTML
# built at deploy time is never served to anyone.
#
# SL Politics prerenders a real file for every real route, so there is nothing to
# fall back to and no reason to want one.

# Zone definitions are http-context directives — valid here only because this
# file is `include`d from inside an http {} block (see deploy/README.md).
# Rate bounds a single source generously enough that no real crawler or
# reader is affected (see the crawlability hard gate in CLAUDE.md: this must
# never be tight enough to make validate:crawlability or a real search-engine
# crawl look like abuse) while still capping an obvious flood.
limit_req_zone $binary_remote_addr zone=javora_static:10m rate=30r/s;

server {
  listen 443 ssl;
  http2 on;
  # L-5 (docs/security-audit-followup-2026-09-04.md): www.javora.lk removed
  # from this block's server_name. nginx picks the FIRST server block whose
  # server_name matches a request (falling back to the first block for the
  # listen/IP pair when none match exactly) — with www listed here too, this
  # block won a tie against the dedicated "canonical host" redirect block
  # below, which server_name www.javora.lk was defined for and could
  # therefore never actually be reached. One hostname must resolve to
  # exactly one server block, or nginx also just warns about the conflicting
  # name at startup.
  server_name javora.lk;

  root /var/www/javora;
  index index.html;

  # TLS (L-5). Paths assume certbot's default Let's Encrypt layout — replace
  # with wherever your certificate actually lives; the names themselves are
  # placeholders, not a working default; nginx refuses to start with a
  # missing certificate.
  ssl_certificate     /etc/letsencrypt/live/javora.lk/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/javora.lk/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:JavoraSSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # OCSP stapling — the server (not each visiting browser) checks
  # certificate revocation status with the CA and attaches the result to the
  # handshake. `ssl_trusted_certificate` is the CA chain, NOT the site's own
  # certificate — usually named chain.pem alongside fullchain.pem/privkey.pem
  # above in certbot's layout.
  ssl_stapling on;
  ssl_stapling_verify on;
  ssl_trusted_certificate /etc/letsencrypt/live/javora.lk/chain.pem;
  resolver 1.1.1.1 8.8.8.8 valid=300s;
  resolver_timeout 5s;

  # Don't advertise the exact nginx build in the Server header / default
  # error pages — free reconnaissance for an attacker matching CVEs to a
  # version number.
  server_tokens off;

  # No endpoint on this origin accepts a body of any size (the API is a
  # separate origin, called cross-origin per deploy/README.md). Capping this
  # tightly costs nothing legitimate and removes one cheap DoS vector.
  client_max_body_size 64k;

  limit_req zone=javora_static burst=60 nodelay;

  # --- Resolution order --------------------------------------------------
  # 1. the exact file            /sitemap.xml
  # 2. that path's directory     /person/x -> /person/x/index.html
  # 3. a real 404
  location / {
    try_files $uri $uri/index.html =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  # --- Caching -----------------------------------------------------------
  # Asset filenames contain a content hash, so their contents can never change
  # under a given name and they are safe to cache indefinitely.
  # Every location block below that sets its OWN `add_header` (a
  # `Cache-Control` line, in all three cases) must also `include
  # security-headers.conf;` — nginx inherits `add_header` from the server
  # block above only when the current block declares none at all, so without
  # the include, every response these three blocks match would silently carry
  # no CSP/HSTS/framing/nosniff protection. deploy/nginxCsp.test.mjs asserts
  # this structurally: it fails the build if any of the three ever loses the
  # include, or if a future location block adds `add_header` without one.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include security-headers.conf;
    try_files $uri =404;
  }

  # HTML must revalidate. Without this a returning reader keeps a cached copy
  # of a profile after synchronisation has corrected it — which for a civic
  # record is not a performance question but an accuracy one.
  location ~* \.html$ {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    include security-headers.conf;
  }

  # sitemap.xml and robots.txt are read by crawlers on their own schedule; a
  # long cache here delays discovery of new profiles.
  location ~* ^/(sitemap\.xml|robots\.txt)$ {
    add_header Cache-Control "public, max-age=3600" always;
    include security-headers.conf;
  }

  # --- Security headers --------------------------------------------------
  # See deploy/security-headers.conf for the six headers themselves and why
  # they are a separate, `include`d file rather than inline `add_header`
  # lines here (H-2: nginx's add_header inheritance rule). Keep in step with
  # dist/_headers, which the build generates.
  include security-headers.conf;

  # --- Compression -------------------------------------------------------
  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_types        text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

  # Dotfiles are never part of a build output; refusing them is cheap
  # insurance against one being copied into the web root by accident.
  location ~ /\. {
    deny all;
  }

  # None of these extensions are ever part of dist/ either — a database
  # file, backup or dump copied into the web root by an operator mistake
  # (e.g. `cp .data/backups/*.db /var/www/javora/`) should still 404/403
  # rather than serve, even though root is not supposed to contain one.
  location ~* \.(db|db-wal|db-shm|sqlite|sqlite3|bak|backup|sql|dump|log|env)$ {
    deny all;
  }
}

# Canonical host. Every page declares one canonical URL, and serving the same
# content on a second hostname without redirecting splits it across two.
# Reachable now that the main block above no longer also claims www (L-5).
server {
  listen 443 ssl;
  http2 on;
  server_name www.javora.lk;

  # A redirect-only block still terminates the TLS handshake before it can
  # send that redirect, so it needs a valid certificate too — the same one
  # as the main block, assuming (as certbot does by default when asked for
  # both names) a single certificate covering both javora.lk and
  # www.javora.lk as Subject Alternative Names.
  ssl_certificate     /etc/letsencrypt/live/javora.lk/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/javora.lk/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:JavoraSSL:10m;

  return 301 https://javora.lk$request_uri;
}

server {
  listen 80;
  server_name javora.lk www.javora.lk;
  return 301 https://javora.lk$request_uri;
}
